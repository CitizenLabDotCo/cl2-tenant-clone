# This docker-compose file is intended for development purposes only
version: '3'
services:
  cl2-tenant-clone:
    build: .
    command: ruby server.rb
    volumes:
      - .:/cl2-tenant-clone
    env_file:
      - .env
    depends_on:
      localstack:
        condition: service_started

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  test:
    build: .
    profiles: [test]
    depends_on:
      postgres-test:
        condition: service_healthy
      localstack:
        condition: service_started
    env_file:
      - .env-test
    volumes:
      - .:/cl2-tenant-clone

networks:
  default:
    external:
      name: citizenlab
