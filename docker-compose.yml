# This docker-compose file is intended for development purposes only
version: '3'
services:
  cl2-tenant-clone:
    build: .
    command: ruby server.rb
    volumes:
      - .:/cl2-tenant-clone
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.8-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  test:
    build: .
    profiles: [test]
    depends_on:
      postgres-test:
        condition: service_healthy
      localstack:
        condition: service_started
    environment:
      PGHOST: postgres-test
      PGUSER: postgres
      PGPASSWORD: postgres
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_S3_CLONE_BUCKET: test-clone-bucket
      AWS_S3_CLUSTER_BUCKET: test-cluster-bucket
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - .:/cl2-tenant-clone

networks:
  default:
    external:
      name: citizenlab
